name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ATELIER_TEST_NO_REAL_PROVIDER: "1"

jobs:
  # The campaign batch, via scripts/test-batch.mjs. It replaces a bare
  # `node --test`, which discovered 67 files against this batch's 53 and then
  # HUNG on the *.browser.test.mjs suites (no Chrome on the runner). A bare run
  # sat at 1h13m against a ~70s batch before being cancelled, so this job had
  # never actually gated anything. The script documents both exclusions.
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      # The batch resolves `claude` and `br` through PATH when it builds an
      # execution profile, but never EXECUTES them - dispatch tests inject their
      # own spawner. Their presence is a precondition, not the thing under test,
      # so stubs satisfy it honestly. Proven locally: with the real binaries
      # removed the batch drops to 41 failures in dispatch.test.mjs alone, and
      # with these stubs it returns to 1072/1072.
      #
      # Without this the batch is not hermetic - it passes on a maintainer
      # machine that happens to have the provider toolchain installed and
      # collapses anywhere else, which is precisely what the previously-hanging
      # CI job could never tell us.
      - name: Install provider stubs
        shell: bash
        run: |
          set -euo pipefail
          stub_dir="$RUNNER_TEMP/provider-stubs"
          mkdir -p "$stub_dir"
          for name in claude br; do
            # %%s so the OUTER printf emits a literal %s into the stub, rather
            # than consuming it here and writing a stub that ignores its own name.
            printf '#!/bin/sh\nprintf "%%s stub 1.0\\n" "$(basename "$0")"\n' >"$stub_dir/$name"
            chmod +x "$stub_dir/$name"
          done
          echo "$stub_dir" >>"$GITHUB_PATH"

      # scripts/test-batch.mjs owns the file set, and `npm test` runs the same
      # thing a maintainer runs locally. Duplicating the enumeration here is how
      # CI and local drift apart.
      - name: Run the campaign test batch
        # Hosted runners have ~4 cores and this suite spawns real dispatchers, git
        # and provider children per file. At Node's default concurrency (one file
        # per core) they starve each other and a DIFFERENT small set of
        # time-sensitive boot/convoy/claim tests fails each run - contention that
        # reads as flakiness, which is why chasing the individual tests never
        # converged.
        #
        # Reproduced locally with `taskset -c 0-3` to model a 4-core runner:
        # default concurrency fails 2, concurrency 2 still fails 1-2, concurrency 1
        # passes 1072/1072 three times in ~2m24s. Serialising costs a couple of
        # minutes and buys a gate whose red actually means something.
        env:
          ATELIER_TEST_CONCURRENCY: "1"
        run: npm test

  # The P0 proof rail. It existed as an npm script and was never invoked by CI, so
  # until now it had only ever run on the maintainer's machine.
  golden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - name: Run the golden production-entrypoint suite
        run: node test-system/run-tests.mjs

  # ATT-011 mutation matrix: breaks one integrity guard at a time in production
  # source and requires the named gate to turn red and to localize. A green suite
  # that asserts nothing is the failure mode this exists to catch - it already
  # found one: the invalid-bearer refusal was unasserted anywhere.
  mutation-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - name: Install provider stubs
        shell: bash
        run: |
          set -euo pipefail
          stub_dir="$RUNNER_TEMP/provider-stubs"
          mkdir -p "$stub_dir"
          for name in claude br; do
            printf '#!/bin/sh\nprintf "%%s stub 1.0\\n" "$(basename "$0")"\n' >"$stub_dir/$name"
            chmod +x "$stub_dir/$name"
          done
          echo "$stub_dir" >>"$GITHUB_PATH"
      - name: Run the mutation matrix
        run: node test-system/mutation-matrix.mjs

  packed-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - name: Pack and smoke-test the installed artifact
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          config_dir="$(mktemp -d)"
          state_dir="$(mktemp -d)"
          shim_dir="$(mktemp -d)"
          npm pack --pack-destination "$pack_dir"
          cd "$install_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$pack_dir"/*.tgz
          ./node_modules/.bin/atelier --help
          ATELIER_CONFIG_DIR="$config_dir" ATELIER_STATE_DIR="$state_dir" \
            ./node_modules/.bin/atelier init
          printf '#!/bin/sh\nprintf "test shim 1.0\\n"\n' >"$shim_dir/br"
          printf '#!/bin/sh\nprintf "test shim 1.0\\n"\n' >"$shim_dir/claude"
          chmod +x "$shim_dir/br" "$shim_dir/claude"
          # This runner has no bubblewrap. doctor must still succeed, because the
          # default confinement is trusted-local and asks for no backend at all -
          # an absent backend is evidence, not a failure. Fail-closed lives on the
          # dispatch that requests confinement. This step is what caught the
          # regression where it did not.
          PATH="$shim_dir:$PATH" ATELIER_CONFIG_DIR="$config_dir" ATELIER_STATE_DIR="$state_dir" \
            ./node_modules/.bin/atelier doctor
